[supervisord]
nodaemon=true
logfile=/dev/stdout
logfile_maxbytes=0
loglevel=info

[program:worker]
command=python -m worker.server
directory=/app
autostart=true
autorestart=true
startretries=5
# Worker bot boshlashidan OLDIN tayyor bo'lishi kerak
priority=1
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:bot]
command=python -m bot.main
directory=/app
autostart=true
autorestart=true
startretries=5
# Bot worker tayyorlanib bo'lgandan keyin (5 soniya kutadi)
priority=10
startsecs=5
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
