services:
  - type: web
    name: cdr-bot
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: frankfurt
    autoDeploy: true
    healthCheckPath: /healthz
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: WEBHOOK_SECRET
        sync: false
      - key: WORKER_TOKEN
        sync: false
      - key: DATA_KEY
        sync: false
      - key: ADMIN_IDS
        sync: false
      - key: WEBHOOK_BASE_URL
        value: https://cdr-bot-4tz4.onrender.com
