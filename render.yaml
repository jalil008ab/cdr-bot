services:
  - type: web
    name: cdr-bot
    runtime: docker
    dockerfilePath: ./docker/Dockerfile.combined
    dockerContext: .
    plan: starter          # DIQQAT: Free planda disk ishlamaydi. Free uchun 'disk' bo'limini olib tashlang.
    healthCheckPath: /healthz
    disk:
      name: bot-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: PORT
        value: "8080"
      - key: WORKER_URL
        value: http://127.0.0.1:8081
      - key: DB_PATH
        value: /data/bot.db
      - key: JOB_MEM_MB
        value: "350"
      - key: WORKER_CONCURRENCY
        value: "1"
      - key: WEBHOOK_SECRET
        value: OQDgEKlP6t6maNU0esbH7ujkhkwusZApoxZUy-MujJM
