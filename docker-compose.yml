# Render.com uchun sozlangan docker-compose
# FARQLAR asl versiyadan:
#   1. bot + worker BITTA konteynerda (Render free/starter = 1 service)
#   2. read_only: false  (Render tmpfs mount qo'llab-quvvatlamaydi)
#   3. tmpfs yo'q  (Render qo'llab-quvvatlamaydi)
#   4. user: "10001:10001" yo'q (Render root bilan ishlaydi)
#   5. cap_drop yo'q (Render imtiyozlar bilan chiqarib tashlaydi)
#   6. caddy profili olib tashlandi (Render o'zi HTTPS beradi)
#   7. WEBHOOK_BASE_URL = Render bergan https://your-app.onrender.com
#
# Ishga tushirish Render'da:
#   - Service type: Web Service
#   - Dockerfile: docker/Dockerfile.combined
#   - Port: 8080
#   - Environment variables: .env dagi hammasi
name: cdr-bot

services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile.combined
    env_file: .env
    environment:
      WORKER_URL: http://127.0.0.1:8081
      DB_PATH: /data/bot.db
    ports:
      - "0.0.0.0:8080:8080"
    volumes:
      - bot-data:/data
    mem_limit: 2g
    restart: unless-stopped

volumes:
  bot-data: {}
