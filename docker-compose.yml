# Ishga tushirish:
#   docker compose --profile proxy up -d --build     (VPS + domen, Caddy avtomatik HTTPS)
#   docker compose up -d --build                      (o'z tunnel'ingiz: bot 127.0.0.1:8080 da)
name: cdr-bot

services:
  bot:
    build:
      context: .
      dockerfile: docker/Dockerfile.bot
    env_file: .env
    environment:
      WORKER_URL: http://worker:8081
      DB_PATH: /data/bot.db
    ports:
      - "127.0.0.1:8080:8080"   # faqat localhost: tashqariga proksi/tunnel orqali
    networks: [edge, internal]
    depends_on:
      worker:
        condition: service_healthy
    user: "10001:10001"
    read_only: true
    tmpfs:
      - /tmp:size=64m,noexec,nosuid
    volumes:
      - bot-data:/data
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 256m
    pids_limit: 128
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.worker
    # Worker faqat o'ziga kerak sirlarni ko'radi (BOT_TOKEN yo'q!)
    environment:
      WORKER_TOKEN: ${WORKER_TOKEN:?WORKER_TOKEN .env da yo'q}
      JOB_TMP_DIR: /tmp
      MAX_FILE_MB: "20"
      JOB_CPU_SECONDS: "20"
      JOB_WALL_SECONDS: "40"
      JOB_MEM_MB: "900"
      WORKER_CONCURRENCY: "2"
    networks: [internal]            # internal: tashqi internetga chiqish yo'q
    user: "10002:10002"
    read_only: true
    tmpfs:
      - /tmp:size=512m,noexec,nosuid
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 2g
    cpus: 1.5
    pids_limit: 64
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8081/healthz', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  caddy:
    image: caddy:2.8-alpine
    profiles: ["proxy"]
    environment:
      DOMAIN: ${DOMAIN:?DOMAIN .env da yo'q}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks: [edge]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 128m
    restart: unless-stopped

networks:
  edge: {}
  internal:
    internal: true

volumes:
  bot-data: {}
  caddy-data: {}
  caddy-config: {}
